name: CI

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Probe official Open API access
        env:
          DATA_GO_KR_API_KEY: ${{ secrets.DATA_GO_KR_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${DATA_GO_KR_API_KEY:-}" ]; then
            echo 'DATA_GO_KR_API_KEY is not configured for this repository or organization.' >&2
            exit 1
          fi
          curl --fail --silent --show-error --get \
            'https://apis.data.go.kr/1741000/household_waste_info/info' \
            --data-urlencode "serviceKey=${DATA_GO_KR_API_KEY}" \
            --data-urlencode 'pageNo=1' \
            --data-urlencode 'numOfRows=1' \
            --data-urlencode 'returnType=json' \
            --output /tmp/official-api.json
          node -e "const fs=require('fs'); const data=JSON.parse(fs.readFileSync('/tmp/official-api.json','utf8')); console.log(JSON.stringify({type:Array.isArray(data)?'array':typeof data,keys:data&&typeof data==='object'?Object.keys(data).slice(0,12):[]},null,2));"
      - name: Domain tests
        run: npm run test:domain
      - name: UI tests when configured
        run: npm test --if-present
      - name: Typecheck
        run: npm run typecheck
      - name: Build when configured
        run: npm run build --if-present
