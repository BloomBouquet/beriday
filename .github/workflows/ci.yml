name: CI

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Probe official production dataset
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --user-agent 'BeridayDataRefresh/1.0' \
            'https://file.localdata.go.kr/file/household_waste_info/info' \
            --output /tmp/official-household-waste.csv
          echo "downloaded_bytes=$(wc -c < /tmp/official-household-waste.csv)"
          head -c 160 /tmp/official-household-waste.csv | tr '\n' ' '
          echo
          npm run build:official-data -- \
            --input /tmp/official-household-waste.csv \
            --output /tmp/official-data.json \
            --imported-at 2026-08-28T00:00:00.000Z
          node -e "const fs=require('fs'); const data=JSON.parse(fs.readFileSync('/tmp/official-data.json','utf8')); console.log(JSON.stringify({regions:data.regions.length,rules:data.rules.length,reports:data.reports},null,2));"
      - name: Domain tests
        run: npm run test:domain
      - name: UI tests when configured
        run: npm test --if-present
      - name: Typecheck
        run: npm run typecheck
      - name: Build when configured
        run: npm run build --if-present
