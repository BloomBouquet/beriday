name: CI

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Inspect official API response shape via diagnostic proxy
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --get \
            'https://k-skill-proxy.nomadamas.org/v1/household-waste/info' \
            --data-urlencode 'cond[SGG_NM::LIKE]=강남구' \
            --data-urlencode 'pageNo=1' \
            --data-urlencode 'numOfRows=100' \
            --output /tmp/official-api.json
          node <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('/tmp/official-api.json', 'utf8'));
          const rows = Array.isArray(data) ? data : (data.body?.items ?? data.items ?? data.response?.body?.items ?? []);
          const first = Array.isArray(rows) ? rows[0] : null;
          console.log(JSON.stringify({
            rootKeys: data && typeof data === 'object' && !Array.isArray(data) ? Object.keys(data) : [],
            rowCount: Array.isArray(rows) ? rows.length : null,
            firstRowKeys: first && typeof first === 'object' ? Object.keys(first) : [],
            sampleRegion: first ? { sido: first.CTPV_NM, sigungu: first.SGG_NM, zone: first.MNG_ZONE_NM, target: first.MNG_ZONE_TRGT_RGN_NM } : null,
          }, null, 2));
          NODE
      - name: Domain tests
        run: npm run test:domain
      - name: UI tests when configured
        run: npm test --if-present
      - name: Typecheck
        run: npm run typecheck
      - name: Build when configured
        run: npm run build --if-present
