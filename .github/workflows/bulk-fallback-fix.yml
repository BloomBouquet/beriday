name: Apply bulk fallback contact fix

on:
  push:
    branches:
      - agent/cherry-blossom/frontend/bulk-disposal-ui

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cherry-blossom/frontend/bulk-disposal-ui
      - name: Apply focused App patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/App.tsx')
          text = path.read_text(encoding='utf-8')

          source_start_marker = '  const fallbackSource = uniqueProvenance(regionRules).find('
          source_end_marker = '  const canLinkGuide = Boolean(guide && isAllowedOfficialUrl(guide.procedureUrl));'

          if source_start_marker in text:
              source_start = text.index(source_start_marker)
              source_end = text.index(source_end_marker, source_start)
              replacement = """  const fallbackSources = uniqueProvenance(regionRules).filter(
            (source) => source.authorityName || source.authorityContact,
          );
          """
              text = text[:source_start] + replacement + text[source_end:]
          elif '  const fallbackSources = uniqueProvenance(regionRules).filter(' not in text:
              raise SystemExit('fallback source block not found')

          view_start_marker = '        ) : (\n          <div className="search-result-section">\n            <strong>{fallbackSource?.authorityName'
          view_end_marker = '\n        )}\n\n        <div className="search-result-source">'

          if view_start_marker in text:
              view_start = text.index(view_start_marker)
              view_end = text.index(view_end_marker, view_start)
              replacement = """        ) : (
          <div className="search-result-section">
            {fallbackSources.length > 0 ? (
              fallbackSources.map((source) => (
                <div key={provenanceKey(source)}>
                  <strong>{source.authorityName ?? `${region.sigungu} 담당기관`}</strong>
                  {source.authorityContact && <span>{source.authorityContact}</span>}
                </div>
              ))
            ) : (
              <strong>{region.sigungu} 담당기관</strong>
            )}
            <span>확인된 공식 신청 URL이 없으므로 임의 링크를 제공하지 않습니다.</span>
          </div>"""
              text = text[:view_start] + replacement + text[view_end:]
          elif '            {fallbackSources.length > 0 ? (' not in text:
              raise SystemExit('fallback view block not found')

          path.write_text(text, encoding='utf-8')
          PY

          if git diff --quiet; then
            echo "No patch required"
            exit 0
          fi

          git config user.name "sunwoo162"
          git config user.email "sunwoosunwoo4114@gmail.com"
          git add src/App.tsx
          git commit -m "fix: preserve all bulk authority contacts"
          git push origin HEAD:agent/cherry-blossom/frontend/bulk-disposal-ui
