name: Apply bulk fallback contact fix

on:
  push:
    branches:
      - agent/cherry-blossom/frontend/bulk-disposal-ui

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cherry-blossom/frontend/bulk-disposal-ui
      - name: Apply focused App patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/App.tsx')
          text = path.read_text(encoding='utf-8')

          old_source = """  const fallbackSource = uniqueProvenance(regionRules).find(
            (source) => source.authorityName || source.authorityContact,
          ) ?? null;
          """
          new_source = """  const fallbackSources = uniqueProvenance(regionRules).filter(
            (source) => source.authorityName || source.authorityContact,
          );
          """

          old_view = """          <div className=\"search-result-section\">
            <strong>{fallbackSource?.authorityName ?? `${region.sigungu} 담당기관`}</strong>
            {fallbackSource?.authorityContact && <span>{fallbackSource.authorityContact}</span>}
            <span>확인된 공식 신청 URL이 없으므로 임의 링크를 제공하지 않습니다.</span>
          </div>
          """
          new_view = """          <div className=\"search-result-section\">
            {fallbackSources.length > 0 ? (
              fallbackSources.map((source) => (
                <div key={provenanceKey(source)}>
                  <strong>{source.authorityName ?? `${region.sigungu} 담당기관`}</strong>
                  {source.authorityContact && <span>{source.authorityContact}</span>}
                </div>
              ))
            ) : (
              <strong>{region.sigungu} 담당기관</strong>
            )}
            <span>확인된 공식 신청 URL이 없으므로 임의 링크를 제공하지 않습니다.</span>
          </div>
          """

          if old_source not in text:
              raise SystemExit('fallback source snippet not found')
          if old_view not in text:
              raise SystemExit('fallback view snippet not found')

          text = text.replace(old_source, new_source, 1).replace(old_view, new_view, 1)
          path.write_text(text, encoding='utf-8')
          PY

          if git diff --quiet; then
            echo "No patch required"
            exit 0
          fi

          git config user.name "sunwoo162"
          git config user.email "sunwoosunwoo4114@gmail.com"
          git add src/App.tsx
          git commit -m "fix: preserve all bulk authority contacts"
          git push origin HEAD:agent/cherry-blossom/frontend/bulk-disposal-ui
