name: Refresh official waste data

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: official-waste-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Set import timestamp
        shell: bash
        run: echo "IMPORTED_AT=$(date -u +'%Y-%m-%dT%H:%M:%S.000Z')" >> "$GITHUB_ENV"

      - name: Refresh and validate official data
        env:
          DATA_GO_KR_API_KEY: ${{ secrets.DATA_GO_KR_API_KEY }}
        run: >-
          npm run refresh:official-data --
          --output ./public/data/official-data.json
          --report-output ./data/reports/official-data-validation.json
          --imported-at "$IMPORTED_AT"

      - name: Verify production data pair
        run: npm run verify:production-data

      - name: Run repository verification
        run: |
          npm run test:domain
          npm test
          npm run typecheck
          npm run build

      - name: Upload review artifacts
        uses: actions/upload-artifact@v4
        with:
          name: official-waste-data-${{ github.run_id }}
          if-no-files-found: error
          path: |
            public/data/official-data.json
            data/reports/official-data-validation.json

      - name: Create data refresh pull request
        env:
          GH_TOKEN: ${{ github.token }}
          DATA_BRANCH: data/official-refresh-${{ github.run_id }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$DATA_BRANCH"
          git add public/data/official-data.json data/reports/official-data-validation.json
          git commit -m "data: refresh official waste dataset"
          git push origin "$DATA_BRANCH"

          cat > pr-body.md <<EOF
          # ✨ PR 내용

          ## 📝 코드 변경 사항
          - 행정안전부 공식 생활쓰레기 Open API를 다시 수집해 production data asset을 갱신했습니다.
          - 같은 refresh 결과에서 생성한 validation summary를 함께 갱신했습니다.

          ## 💡 변경 이유
          - 버리데이가 최신 검증 데이터로 지역별 Today/Weekly 일정을 계산할 수 있도록 하기 위해 필요합니다.
          - source/mapping/normalization/adapter 검증 결과를 데이터 변경과 함께 리뷰할 수 있도록 하기 위해 필요합니다.

          ## 🛠️ 구현 방법
          - DATA_GO_KR_API_KEY는 GitHub Actions secret으로만 주입했습니다.
          - refresh CLI가 official-data.json과 validation report를 같은 bundle에서 생성합니다.
          - validation summary에 critical error가 있으면 파일 갱신과 PR 생성을 중단합니다.
          - production data gate가 asset과 validation report의 timestamp, count, source 기준일, warning을 다시 대조합니다.

          ## 📌 영향 범위
          - public/data/official-data.json
          - data/reports/official-data-validation.json
          - production Today/Weekly/Settings 데이터 근거

          ## ✅ 테스트
          - production data pair verification
          - Domain test
          - UI test
          - TypeScript typecheck
          - production build
          - production validation critical error gate

          **테스트 결과 / 참고 사항**
          - GitHub Actions run: ${{ github.run_id }}
          - Imported at: $IMPORTED_AT
          - validation report는 이 PR의 data/reports/official-data-validation.json에서 확인할 수 있습니다.

          ## 🌿 반영 브랜치
          - main
          EOF

          gh pr create \
            --base main \
            --head "$DATA_BRANCH" \
            --title "chore : 공식 생활쓰레기 데이터 갱신" \
            --body-file pr-body.md
